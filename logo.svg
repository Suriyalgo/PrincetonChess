<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 136 136" width="136" height="136" role="img" aria-label="Princeton Chess Club logo">
  <!-- 8x8 chessboard background -->
  <rect x="0" y="0" width="120" height="120" fill="#fff"/>
  <g><rect x="0.0" y="0.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="30.0" y="0.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="60.0" y="0.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="90.0" y="0.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="15.0" y="15.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="45.0" y="15.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="75.0" y="15.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="105.0" y="15.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="0.0" y="30.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="30.0" y="30.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="60.0" y="30.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="90.0" y="30.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="15.0" y="45.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="45.0" y="45.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="75.0" y="45.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="105.0" y="45.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="0.0" y="60.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="30.0" y="60.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="60.0" y="60.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="90.0" y="60.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="15.0" y="75.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="45.0" y="75.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="75.0" y="75.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="105.0" y="75.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="0.0" y="90.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="30.0" y="90.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="60.0" y="90.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="90.0" y="90.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="15.0" y="105.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="45.0" y="105.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="75.0" y="105.0" width="15.0" height="15.0" fill="#111"/>
    <rect x="105.0" y="105.0" width="15.0" height="15.0" fill="#111"/></g>

  <!-- If you have the official crest file, save it in this folder as crest.png and
       it will load on top of the board. Until then, this vector replica shows. -->
  <image href="crest.png" x="22" y="6" width="76" height="100" preserveAspectRatio="xMidYMid meet" onerror="this.style.display='none'"/>

  <!-- Vector replica of the Princeton shield — scaled up to fill the board -->
  <g transform="translate(-30,-40) scale(1.5)">
    <g transform="translate(60,52)">
      <path d="M-29 -30 H29 V6 C29 25, 15 37, 0 45 C-15 37, -29 25, -29 6 Z"
            fill="#e87722" stroke="#111" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M-29 -30 H29 V-12 L0 -19 L-29 -12 Z" fill="#111"/>
      <rect x="-10" y="-29" width="20" height="11" rx="1.2" fill="#fff" stroke="#111" stroke-width="0.7"/>
      <line x1="0" y1="-29" x2="0" y2="-18" stroke="#111" stroke-width="1"/>
      <g font-family="Georgia, serif" font-size="2.6" fill="#111" text-anchor="middle">
        <text x="-5.5" y="-25.5">VET</text><text x="-5.5" y="-22.8">TES</text><text x="-5.5" y="-20.1">EN</text>
        <text x="5.5" y="-25.5">NOV</text><text x="5.5" y="-22.8">TAM</text><text x="5.5" y="-20.1">TVM</text>
      </g>
      <path d="M-29 1 L0 13 L29 1 V11 L0 23 L-29 11 Z" fill="#111"/>
    </g>
    <g transform="translate(60,104)">
      <path d="M-44 -2 Q-38 -9 -30 -5 L30 -5 Q38 -9 44 -2 Q38 7 30 4 L-30 4 Q-38 7 -44 -2 Z"
            fill="#fff" stroke="#111" stroke-width="1.2"/>
      <text x="0" y="1.4" font-family="Georgia, serif" font-size="5.2" fill="#111" text-anchor="middle" letter-spacing="0.4">DEI SVB NVMINE VIGET</text>
    </g>
  </g>
</svg>